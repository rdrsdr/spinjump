# Publica a versão no navegador (browser/public) no GitHub Pages. O MuJoCo (WebAssembly) e o three.js
# vêm do npm e são copiados para public/vendor aqui; não ficam no repositório.
name: Browser version on GitHub Pages

on:
  push:
    branches: [main]
    paths: ["browser/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: browser
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: browser/package-lock.json
      - run: npm ci
      - run: npm run vendor
      - name: Scenario build matches the Python reference
        run: npm run check
      - name: Short physics run (locked and sliding coils)
        run: |
          npm run bench -- cmp_locked --max-time 3
          npm run bench -- cmp_sliding --max-time 3
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: browser/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
